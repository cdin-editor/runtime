name: Build and publish Runtime source and module packages

on:
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: Test, package and publish Runtime source and module archives
    uses: m-mdy-m/pipeline/.github/workflows/release.yml@75c09b9e6962f3d037198cf72796daf2a35bfb03
    with:
      pipeline-ref: 75c09b9e6962f3d037198cf72796daf2a35bfb03
      changelog-path: CHANGELOG.md
      dry-run: ${{ github.ref_type != 'tag' }}
      # Unit/integration/boundary gates plus source-independent module extraction smoke.
      test-command: bash scripts/ci-check.sh
      # Keep the contributor source archive and add the install-time Lua module package.
      build-command: bash scripts/package-release.sh && python3 scripts/package-modules.py
      # Verify both source and install-time module packages as users receive them.
      artifact-test-command: bash scripts/test-package.sh && python3 scripts/test-module-package.py
      artifact-path: |
        dist/cdin-runtime-*.tar.gz
        dist/cdin-runtime-*.tar.gz.sha256
        dist/cdin-runtime-*.zip
        dist/cdin-runtime-*.zip.sha256
        dist/runtime-*.json
      # Runtime is pure Lua and has one universal target. Multiple matrix jobs
      # would upload identically named artifacts and make release publication ambiguous.
      build-matrix-json: >-
        {"include":[
          {"id":"source-and-modules","os":"ubuntu-24.04"}
        ]}
