name: Build and publish release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      attestations: write
    name: Test, package and publish source archives
    uses: m-mdy-m/pipeline/.github/workflows/release.yml@main
    with:
      pipeline-ref: main
      changelog-path: CHANGELOG.md
      # Installs Lua if needed, then unit + integration tests and boundary checks.
      test-command: bash scripts/ci-check.sh
      # Validates tag == git-derived version == CHANGELOG section, then builds archives.
      build-command: bash scripts/package-release.sh
      # Unpacks the published archive, checks checksums and embedded version,
      # and runs the whole suite inside the package.
      artifact-test-command: bash scripts/test-package.sh
      artifact-path: |
        dist/cdin-runtime-*.tar.gz
        dist/cdin-runtime-*.tar.gz.sha256
        dist/cdin-runtime-*.zip
        dist/cdin-runtime-*.zip.sha256
      # Runtime is pure Lua with identical source on every OS, so a single
      # target builds the archives. Release matrix targets that upload files
      # with the same names would collide on the GitHub Release.
      build-matrix-json: >-
        {"include":[
          {"id":"source","os":"ubuntu-24.04"}
        ]}
