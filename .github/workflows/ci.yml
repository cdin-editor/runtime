name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Main gate. Pipeline has no Lua toolchain, so `custom` is used and the
  # `deps` task in pipeline.toml installs Lua. The `check` task runs the unit
  # and integration tests plus scripts/check-boundaries.sh.
  quality:
    name: Test, boundary and module package verification with Pipeline
    uses: m-mdy-m/pipeline/.github/workflows/ci.yml@main
    with:
      language: custom
      pipeline-task: package-modules
      pipeline-ref: main

  docs:
    name: Documentation and workflow validation
    uses: m-mdy-m/pipeline/.github/workflows/docs-check.yml@main

  # Pipeline's CI runs on Linux with the distribution's Lua 5.4. Runtime is
  # portable Lua, so keep the interpreters and operating systems it must also
  # support. The Linux/Lua 5.4 case is covered by `quality` above.
  portability:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-lua55
            os: ubuntu-latest
            lua_version: "5.5.0"
          - id: macos-lua54
            os: macos-latest
            lua_version: "5.4.8"
          - id: windows-lua54
            os: windows-latest
            lua_version: "5.4.8"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The Lua action builds from source on Windows and needs the MSVC tools.
      - name: Set up MSVC tools
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@v1

      - name: Install Lua
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: ${{ matrix.lua_version }}

      - name: Show interpreter version
        run: lua -v

      - name: Run unit and integration tests
        if: runner.os != 'Windows'
        run: make check LUA=lua

      # GitHub's Windows runner does not guarantee GNU make. The test entry
      # points are Lua scripts, so run those same commands directly there.
      - name: Run unit and integration tests on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          lua tests/unit/run.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          lua tests/integration/run.lua
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
